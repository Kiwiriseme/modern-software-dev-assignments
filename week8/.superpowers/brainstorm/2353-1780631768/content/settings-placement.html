<h2>API 设置入口应该放在哪里？</h2>
<p class="subtitle">你说放在页面左下角。Sidebar 左下角目前有主题切换和计数信息。</p>

<div class="options">
  <div class="option" data-choice="a" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>Sidebar 左下角齿轮图标</h3>
      <p>在 Sidebar footer 区域新增一个齿轮 ⚙ 图标按钮，放在主题切换按钮旁边。点击弹出设置 Dialog。与主题切换同级，自然融入现有 UI。</p>
    </div>
  </div>
  <div class="option" data-choice="b" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>独立的左下角浮动按钮</h3>
      <p>页面左下角悬浮一个固定位置的设置按钮，不依附于 Sidebar。始终可见，但可能与内容重叠。</p>
    </div>
  </div>
  <div class="option" data-choice="c" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>Sidebar 底部独立行</h3>
      <p>在 Sidebar 底部统计信息下面新增一行"设置"，带文字标签和图标，占用更大但更显眼。</p>
    </div>
  </div>
</div>
