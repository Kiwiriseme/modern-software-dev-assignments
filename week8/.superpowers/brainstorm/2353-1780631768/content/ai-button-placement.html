<h2>AI 总结按钮应该放在哪里？</h2>
<p class="subtitle">打开笔记的 DetailPanel 详情面板中的位置选择</p>

<div class="options">
  <div class="option" data-choice="a" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>创建时间下方</h3>
      <p>按照你的描述，在"创建时间"行的正下方增加一个独立按钮"🤖 AI 总结待办事项"。与时间信息紧邻，逻辑上关联"阅读 → 提取待办"。样式：次级按钮，带 AI 火花图标。</p>
    </div>
  </div>
  <div class="option" data-choice="b" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>工具栏区域</h3>
      <p>放在右上角现有操作按钮区域（目前有导出 Markdown、删除按钮），作为第三个操作按钮。和"操作"概念一致，视觉效果更整洁。</p>
    </div>
  </div>
  <div class="option" data-choice="c" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>底部固定栏</h3>
      <p>在 DetailPanel 底部新增一个固定操作栏，放"AI 总结"按钮。始终可见，不随内容滚动，但占用额外空间。</p>
    </div>
  </div>
</div>
